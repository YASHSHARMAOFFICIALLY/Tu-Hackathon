# Typecheck, lint and test every PR; apply migrations only after main is green.
#
# Migrations run BEFORE the app deploys, never after: new code that expects a
# column must never reach production ahead of the column itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-tests
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-client-secret
      # The OAuth-provider smoke test writes temporary state to Postgres. It
      # still runs locally; credential-free CI keeps the pure auth checks.
      SKIP_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # Fails if a schema change was committed without its migration — the
      # single most common way a schema PR breaks the next deploy.
      - run: bunx drizzle-kit check
      - run: bun test

  migrate:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RUN_PRODUCTION_MIGRATIONS == 'true'
    runs-on: ubuntu-latest
    # Point this at a GitHub Environment with required reviewers if you want a
    # human approving production DDL.
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run src/db/migrate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
